name: OpenReview PR Assistant

on:
  issue_comment:
    types: [created]
  pull_request_target:
    types: [opened, synchronize]

jobs:
  review:
    # Only run on pull requests, or if triggered by @openreview mention in comments
    if: >-
      (github.event_name == 'pull_request_target') ||
      (github.event.issue.pull_request && contains(github.event.comment.body, '@openreview'))
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
      issues: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref || github.event.issue.number }}
          fetch-depth: 0

      - name: Install OpenReview CLI
        run: |
          curl -fsSL https://raw.githubusercontent.com/imMamdouhaboammar/openreview/main/install.sh -o /tmp/install-openreview.sh
          bash /tmp/install-openreview.sh
          rm -f /tmp/install-openreview.sh
          echo "$HOME/.openreview/bin" >> $GITHUB_PATH

      - name: Run OpenReview
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          LLM_PROVIDER: ${{ vars.OPENREVIEW_PROVIDER || 'anthropic' }}
          SANDBOX_DRIVER: local
        run: |
          PR_NUM="${{ github.event.pull_request.number || github.event.issue.number }}"
          openreview review --pr "$PR_NUM"
