name: Rust and deployment checks

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  rust:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - name: Formatting
        run: cargo fmt --check
      - name: Clippy
        run: cargo clippy --all-targets -- -D warnings
      - name: Tests
        run: cargo test --all
      - name: Release build
        run: cargo build --release

  dependency-audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - name: Install RustSec audit tool
        run: cargo install cargo-audit --locked
      - name: Scan locked dependencies
        run: cargo audit

  container-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Build service image
        run: docker build -f Dockerfile -t openreview-service:ci .
      - name: Verify registration URL from the built container
        run: |
          registration_url=$(docker run --rm openreview-service:ci github-app-url --domain https://review.example.org --name "OpenReview CI")
          case "$registration_url" in
            https://github.com/settings/apps/new\?*webhook_url=https%3A%2F%2Freview.example.org%2Fapi%2Fwebhooks%2Fgithub*) ;;
            *) echo "Container registration URL did not prefill the expected HTTPS webhook" >&2; exit 1 ;;
          esac
      - name: Build sandbox image
        run: docker build -f Dockerfile.sandbox -t openreview-sandbox:latest .
      - name: Validate Compose interpolation and structure
        env:
          JOB_API_TOKEN: ci-only-temporary-token-with-32-characters
          SANDBOX_DOCKER_SOCKET: /tmp/ci-rootless-docker.sock
          SANDBOX_WORKSPACE_DIR: /tmp/ci-openreview-workspaces
          GITHUB_APP_ID: ci
          GITHUB_APP_PRIVATE_KEY: ci-placeholder
          GITHUB_APP_WEBHOOK_SECRET: ci-placeholder
        run: docker compose config --quiet
      - name: Validate rootless smoke-test script syntax
        run: bash -n scripts/verify-rootless-sandbox.sh

  hosted-rootless-sandbox:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Delegate runner user cgroups through systemd session
        run: |
          set -euo pipefail
          uid="$(id -u)"
          sudo loginctl enable-linger "$(id -un)"
          sudo systemctl start "user@${uid}.service"
          echo "XDG_RUNTIME_DIR=/run/user/${uid}" >> "$GITHUB_ENV"
          echo "DBUS_SESSION_BUS_ADDRESS=unix:path=/run/user/${uid}/bus" >> "$GITHUB_ENV"
          XDG_RUNTIME_DIR="/run/user/${uid}" DBUS_SESSION_BUS_ADDRESS="unix:path=/run/user/${uid}/bus" systemctl --user status >/dev/null
      - name: Create dedicated rootless Docker daemon
        uses: docker/setup-docker-action@v5
        with:
          rootless: true
          set-host: true
      - name: Build and exercise real sandbox isolation
        run: |
          set -euo pipefail
          docker build -f Dockerfile.sandbox -t openreview-sandbox:latest .
          workspace="${RUNNER_TEMP:?}/openreview-workspaces"
          mkdir -p "$workspace"
          SANDBOX_WORKSPACE_DIR="$workspace" ./scripts/verify-rootless-sandbox.sh
      - name: Full read-only agent dry-run against authenticated PR and fake AI endpoint
        if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository
        env:
          GITHUB_TOKEN: ${{ github.token }}
          LLM_PROVIDER: openai
          LLM_MODEL: openreview-e2e-mock
          OPENAI_API_KEY: fake-ci-key-never-used-outside-localhost
          OPENAI_BASE_URL: http://127.0.0.1:38575
          SANDBOX_DRIVER: docker
          BOT_USERNAME: openreview
        run: |
          set -euo pipefail
          export SANDBOX_WORKSPACE_DIR="${RUNNER_TEMP:?}/openreview-workspaces"
          python3 tests/fixtures/openai_mock_server.py 38575 &
          mock_pid=$!
          trap 'kill "$mock_pid" 2>/dev/null || true' EXIT
          for i in {1..10}; do
            if curl -s --max-time 1 http://127.0.0.1:38575/ >/dev/null; then break; fi
            sleep 1
          done
          cargo run --locked --release -- action --dry-run
