-width="2" stroke-linecap="round" fill="none" stroke-dasharray="7 9"/><path d="M102 549L485 549" stroke="#639781" stroke-width="2" stroke-linecap="round" fill="none" stroke-dasharray="7 9"/><path d="M102 720L485 720" stroke="#639781" stroke-width="2" stroke-linecap="round" fill="none" stroke-dasharray="7 9"/><text x="102" y="788" font-family="Arial,Helvetica,sans-serif" font-weight="700" font-size="19" fill="#171717">MASTER: FRONT / ALL POSES</text><rect x="586" y="168" width="763" height="641" rx="18" fill="#FFFEFA" stroke="#E9E2D7" stroke-width="2"/><text x="620" y="224" font-family="Arial,Helvetica,sans-serif" font-weight="800" font-size="23" fill="#171717">GEOMETRY</text><text x="620" y="263" font-family="Arial,Helvetica,sans-serif" font-weight="500" font-size="21" fill="#171717">Head: retained from original logo path</text><text x="620" y="298" font-family="Arial,Helvetica,sans-serif" font-weight="500" font-size="21" fill="#171717">Body: compact upright bean shape</text><text x="620" y="333" font-family="Arial,Helvetica,sans-serif" font-weight="500" font-size="21" fill="#171717">Eye: integrated 28u lens, 9.5u outline</text><text x="620" y="368" font-family="Arial,Helvetica,sans-serif" font-weight="500" font-size="21" fill="#171717">Feet: rounded ink ovals; hands: pale mittens</text><text x="620" y="403" font-family="Arial,Helvetica,sans-serif" font-weight="500" font-size="21" fill="#171717">No mechanical joints. No generic robot details.</text><path d="M620 442L1311 442" stroke="#E9E2D7" stroke-width="3" stroke-linecap="round" fill="none"/><g transform="translate(645 479) scale(1.1)"><g><path d="M47 100C34 83 35 66 42 55c2-3 7 0 15 5-8-11-7-23 2-33 6-7 9 2 14 10 8 14 16 21 28 27 19-11 38-10 60-5 13-10 37-25 49-27 7-1 11 4 15 13l19 38c5 10-1 17-11 27 6 27 3 55-10 78-18 32-50 49-93 51-43 1-77-18-95-49-19-33-11-70 12-90Z" fill="#FFFEFA" stroke="#171717" stroke-width="6" stroke-linecap="round" stroke-linejoin="round" /><path d="M207 47c-1 13-4 24-2 30 2 7 14 9 27 14 4 1 1-6-2-11l-14-31c-3-5-7-6-9-2Z" fill="#171717" /><g fill="none" stroke="#171717" stroke-linecap="round" stroke-linejoin="round"><path d="M137 99q24-23 44-14" fill="none" stroke="#171717" stroke-width="7" stroke-linecap="round" stroke-linejoin="round" /><ellipse cx="82.4" cy="136.3" rx="9.1" ry="12.5" transform="rotate(15 82.4 136.3)" fill="#171717"/><circle cx="164" cy="142" r="28" stroke="#171717" stroke-width="9.5"/><path d="m186 164 17 17" fill="none" stroke="#171717" stroke-width="10" stroke-linecap="round" stroke-linejoin="round" /><path d="M149 140c6-6 16-9 25-4" fill="none" stroke="#171717" stroke-width="6" stroke-linecap="round" stroke-linejoin="round" /><ellipse cx="168" cy="145" rx="6.6" ry="9" transform="rotate(18 160 145)" fill="#171717"/><path d="m101 149 10 12 14-15" fill="none" stroke="#171717" stroke-width="9" stroke-linecap="round" stroke-linejoin="round" /><path d="M141 193q7-12 18-4" fill="none" stroke="#171717" stroke-width="7" stroke-linecap="round" stroke-linejoin="round" /></g></g></g><text x="970" y="535" font-family="Arial,Helvetica,sans-serif" font-weight="800" font-size="22" fill="#171717">ASYMMETRIC</text><text x="970" y="572" font-family="Arial,Helvetica,sans-serif" font-weight="500" font-size="19" fill="#171717">Left flutter / right page-fold.</text><text x="970" y="612" font-family="Arial,Helvetica,sans-serif" font-weight="500" font-size="19" fill="#171717">Preserve lens + check at all times.</text><text x="970" y="654" font-family="Arial,Helvetica,sans-serif" font-weight="500" font-size="19" fill="#171717">Small sizes use the isolated icon.</text><text x="970" y="694" font-family="Arial,Helvetica,sans-serif" font-weight="500" font-size="19" fill="#171717">Keep silhouette and expression readable.</text></svg>